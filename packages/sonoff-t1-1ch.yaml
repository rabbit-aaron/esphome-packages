esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m
  restore_from_flash: true
  early_pin_init: false

packages:
  logger: !include: logger.yaml
  api: !include: api.yaml
  ota: !include: ota.yaml
  wifi: !include: wifi.yaml
  captive_portal: !include: captive_portal.yaml

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    on_press:
      then:
        - switch.toggle: switch_1

switch:
  - platform: gpio
    name: "Switch"
    id: switch_1
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_OFF

status_led:
  pin:
    number: GPIO13
    inverted: true
